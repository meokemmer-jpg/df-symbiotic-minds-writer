df_id: df-symbiotic-minds-writer
df_name: Buecher-Trilogie-Symbiotic-Minds
welle_introduced: welle-44
type: foundation-df
crux-mk: true
k0_touch: false
q0_touch: false
phronesis_required: false

# === Default-Action (per ausreden-schutz.md Schicht 2, Welle-47 Migration Batch-1) ===
default_action:
  description: "Chapter-Generation fuer 'Symbiotic Minds' (14 Kapitel, ~8000 Worte/Kapitel, Kaestner-Dyslexia-Friendly Style) + Outline-Manager + Style-Guide-Validation"
  rho_per_run_eur: 30
  rho_validation_source: unvalidated
  block_gates:
    - gate_id: K15
      block_reason: "Pipeline-Cost-Estimate Pflicht: max 5 chapter-generations pro Run (quota_budget_ceiling)"
      false_block_cost_eur: 20
      legitimate_block_condition: "Quota-Budget ueberschritten ODER Pipeline-Cost-Estimate fehlt"
    - gate_id: K16
      block_reason: "Concurrent-Spawn-Protection: lock-dir /tmp/df-symbiotic-minds-writer.lock"
      false_block_cost_eur: 10
      legitimate_block_condition: "Lock-File juenger als 6h existiert + andere PID via pgrep"
  graceful_degradation_path: "Mock-Chapter-Mode bei DF_BOOK_REAL_ENABLED=false ODER real-llm-api unreachable >60s - Outline-Manager + Style-Guide bleiben aktiv"

# K11 Cascade-Containment
cascade_isolation: hard
failure_blast_radius: 1
dependency_dlq_strategy: separate

# K12 Distillation-Resistenz
output_feeds_into_training: false
provenance_required_in_output: true
non_llm_validation_layer: true

# K13 Independent-Ground-Truth
external_anchor_type: drive_filesystem
external_anchor_validation_frequency: per-run
pre_action_domain_check: true
pre_action_backup_check: false
pre_action_blast_radius_check: true

# K14 Human-Override-Decay
override_complexity: single_command
override_documentation_freshness_days: 30
martin_review_cadence: monthly
bus_factor_handover_drilled: false

# K15 Entropy-Budget
entropy_added_loc_estimate: 800
entropy_added_concepts:
  - chapter-generator-stub
  - outline-manager-fixed
  - style-guide-kaestner
entropy_justified_by_rho: high
entropy_subtractive_potential: false

# K16 Concurrent-Spawn-Mutex
concurrent_spawn_protection: both
lock_dir: /tmp/df-symbiotic-minds-writer.lock
lock_stale_age_h: 6
engine_pgrep_check: true
lock_release_on: EXIT_INT_TERM

# K11.b Pipeline-Cost-Estimate
pipeline_cost_estimate_required: true
cost_estimate_method: static_pre_run
quota_budget_ceiling: 5  # max 5 chapter-generations per run
cost_overrun_action: warn

# Lose-Coupling (LC1-LC5)
lose_coupling:
  LC1_graceful_degradation:
    degradation_modes:
      - full              # Real-LLM via ENV-Var
      - degraded_no_llm   # Mock-Chapter only
      - sandbox_mock      # Test-Mode
    degradation_test_required: true
  LC2_direct_mode:
    direct_mode_available: true
    direct_mode_capability: 0.5
    direct_mode_trigger: "real-llm-api unreachable >60s OR ENV not set"
  LC3_circuit_breaker:
    circuit_breaker_timeout_s: 60
    circuit_breaker_open_threshold: 3
    circuit_breaker_half_open_test_interval_s: 600
  LC4_failure_isolation:
    state_externalization: true
    idempotent_operations: true
    dependency_dlq_separate: true
  LC5_health_check:
    health_check_dependencies: []
    health_check_degraded_score: 0.5
    health_check_endpoint_or_file: "branch-hub/state/df-symbiotic-minds-writer-health.json"

# ENV-Var-Gates
env_vars:
  DF_BOOK_REAL_ENABLED:
    default: "false"
    activation: "phronesis_ticket_required"
  PHRONESIS_TICKET:
    default: ""
    required_when: "DF_BOOK_REAL_ENABLED=true"

# Buch-spezifika
book_metadata:
  title: "Symbiotic Minds"
  subtitle: "Mensch-AI-Symbiose"
  chapters_count: 14
  style_guide: kaestner_dyslexia_friendly
  target_words_per_chapter: 8000

# --- K11-16 Board-Haertung (evidence-based, df_k_hardening) [CRUX-MK] ---
K11_cascade_containment: isolated_run  # evidence: df_foundation.isolated_run (echte Failure-Isolation)
K14_human_override_decay: foundation_override  # evidence: df_foundation.run_guarded (STOP.flag-Override)
K15_entropy_budget: foundation_budget  # evidence: df_foundation.run_guarded (Tages-Lauf-Budget)
K16_concurrent_spawn_mutex: foundation_mutex  # evidence: df_foundation.spawn_mutex (atomarer Lock)
K_hardening_gap: [distillation_resistance, independent_ground_truth]  # echte Luecke -> Code noetig
K_hardening_level: declared  # 4/6 evidenz-belegt
K_hardening_ts: 2026-06-23T05:28:42.171681+00:00
